name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --ignore-scripts && npm test
      - run: ./gradlew build --console=plain
      - name: Package bridge and checksums
        shell: bash
        run: |
          mkdir -p release
          cp build/libs/*.jar release/
          git archive --format=zip --prefix=t3-minecraft-bridge/ -o release/t3-minecraft-bridge-source.zip HEAD
          (cd release && sha256sum *.jar *.zip > SHA256SUMS.txt)
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
